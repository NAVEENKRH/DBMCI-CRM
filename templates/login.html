<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Log in — DBMCI Sales CRM</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  body { font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
</style>
</head>
<body class="bg-[#10233f] min-h-screen flex items-center justify-center px-4">

<div class="w-full max-w-sm">
  <div class="text-center mb-6">
    <div class="text-white font-bold text-2xl tracking-tight">DBMCI <span style="color:#8fb0e8">Sales CRM</span></div>
  </div>

  <div class="bg-white rounded-xl shadow-lg p-6">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% if messages %}
        {% for category, message in messages %}
          <div class="mb-4 rounded-lg px-3 py-2 text-sm font-medium bg-amber-50 text-amber-800 border border-amber-200">{{ message }}</div>
        {% endfor %}
      {% endif %}
    {% endwith %}
    <form method="post" class="space-y-4">
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Email</label>
        <input type="email" name="email" required autofocus class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <div>
        <label class="block text-xs font-medium text-slate-500 mb-1">Password</label>
        <input type="password" name="password" required class="w-full border border-slate-300 rounded-lg px-3 py-2 text-sm">
      </div>
      <button type="submit" class="w-full px-4 py-2 rounded-lg bg-[#2a78d6] text-white text-sm font-semibold hover:bg-[#1f5fb0]">Log in</button>
    </form>
    <p class="text-xs text-slate-400 mt-4 text-center">Accounts are created by your admin — there's no self-signup.</p>
  </div>
</div>

</body>
</html>
